<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - MotoRepuestos Express JYC</title>
  <link rel="stylesheet" href="style/styleregistro.css">
</head>
<body>
  <main>
    <!-- Logo -->
    <div class="logo">
      <img src="IMG/jyclogo.png" alt="MotoRepuestos Express JYC">
    </div>

    <!-- Encabezado -->
    <header>
      <h1>Registro</h1>
      <p>Crea tu cuenta en MotoRepuestos Express JYC</p>
    </header>

    <!-- Formulario -->
    <form id="form-registro" action="#" method="post">
      <label for="nombre">* Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="apellido">* Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="documento">Tipo de documento:</label>
      <select id="documento" name="documento">
        <option value="cc">Cédula de Ciudadanía</option>
        <option value="ti">Tarjeta de Identidad</option>
        <option value="ce">Cédula de Extranjería</option>
      </select>

      <label for="numdoc">Número de documento:</label>
      <input type="text" id="numdoc" name="numdoc">

      <label for="correo">* Correo electrónico:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="usuario">* Nombre de usuario:</label>
      <input type="text" id="usuario" name="usuario" required>

      <label for="clave">* Contraseña:</label>
      <input type="password" id="clave" name="clave" required>

      <div class="options">
        <label>
          <input type="checkbox" required>
          Autorizo el tratamiento de datos personales
        </label>
      </div>

      <button type="submit" class="btn-login">CREAR CUENTA</button>
      <button type="button" class="btn-register" onclick="location.href='login.html'">Volver al Inicio de Sesión</button>
    </form>
  </main>
</body>
<script src="script/auth.js"></script>
</html>
