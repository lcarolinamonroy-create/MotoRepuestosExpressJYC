<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña - MotoRepuestos Express JYC</title>
  <link rel="stylesheet" href="style/stylerecuperar.css">
</head>
<body>
  <main>
    <!-- Logo -->
    <div class="logo">
      <img src="IMG/jyclogo.png" alt="MotoRepuestos Express JYC">
    </div>

    <!-- Encabezado -->
    <header>
      <h1>Recuperar Contraseña</h1>
      <p>Ingresa tu correo electrónico para restablecer tu contraseña</p>
    </header>

    <!-- Formulario -->
    <form id="form-recuperar" action="#" method="post">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>

      <button type="submit" class="btn-login">ENVIAR ENLACE DE RECUPERACIÓN</button>
      <button type="button" class="btn-register" onclick="location.href='login.html'">Volver al Inicio de Sesión</button>
    </form>
  </main>
</body>
<script src="script/auth.js"></script>
</html>
