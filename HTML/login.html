<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión - MotoRepuestos Express</title>
  <link rel="stylesheet" href="style/stylelogin.css">
  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <main>
    <!-- Logo -->
    <div class="logo">
      <img src="IMG/jyclogo.png" >
    </div>

    <!-- Encabezado -->
    <header>
      <h2>Bienvenido</h2>
      <p>Ingresa a tu Cuenta</p>

    </header>

    <!-- Formulario -->
    <form id="form-login" action="#" method="post">
      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" name="clave" placeholder="********" required>

      <div class="options">
        <label><input type="checkbox" name="recordar"> Recordarme</label>
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login">INICIAR SESIÓN</button>
      <button type="button" class="btn-register" onclick="location.href='registro.html'">Registrar Nueva Cuenta</button>
    </form>
     <footer>
    © 2026 MotoRepuestos Express – JYC 
  </footer>

    <p class="terms">Al iniciar sesión, aceptas nuestros <a href="#">Términos y Condiciones</a></p>
  </main>
</body>
<script src="script/auth.js"></script>
</html>
