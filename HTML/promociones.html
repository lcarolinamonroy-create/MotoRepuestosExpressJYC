<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Promociones - Moto Repuestos Express JYC</title>
  <link rel="stylesheet" href="style/promociones.css">
</head>
<body>

    <header>
  <div class="logo">
    <img src="IMG/jyclogo.png" alt="Logo JYC">
    <h1>Moto Repuestos Express JYC</h1>
  </div>
  <a href="carrito.html" class="btn-in-carrito">Ver carrito</a>
</header>

<h2 id="titulo">Promociones del Año</h2>

  <!-- Sección de promociones -->
  <main class="promociones">
    <div class="promo-card">
      <img src="IMG/aceite.png" alt="Aceite en promoción">
      <h3>Aceite 20% OFF</h3>
      <p>Precio especial por tiempo limitado.</p>
      <button type="button" class="btn-comprar" data-producto="Aceite">Comprar</button>
    </div>

    <div class="promo-card">
      <img src="IMG/llanta.png" alt="Llanta en promoción">
      <h3>Llantas 15% OFF</h3>
      <p>Descuento en todas las referencias.</p>
      <button type="button" class="btn-comprar" data-producto="Llanta">Comprar</button>
    </div>

    <div class="promo-card">
      <img src="IMG/Frenos.png" alt="Frenos en promoción">
      <h3>Frenos 10% OFF</h3>
      <p>Seguridad al mejor precio.</p>
      <button type="button" class="btn-comprar" data-producto="Frenos">Comprar</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026 Moto Repuestos Express JYC</p>
  </footer>

  <script src="script/promociones.js"></script>
</body>
</html>
